name: Auto Release

on:
  schedule:
    - cron: '59 23 * * *'   # 23:59 UTC daily

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to collect commit messages

      - name: Check for unreleased commits
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y-%m-%d)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          LAST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            COUNT=$(git log --oneline | wc -l)
          else
            COUNT=$(git log --oneline "${LAST_TAG}..HEAD" | wc -l)
          fi
          echo "count=${COUNT}" >> $GITHUB_OUTPUT
          if [ "$COUNT" -gt 0 ] && ! gh release view "${TAG}" > /dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Collect commit messages since last release
        if: steps.check.outputs.skip == 'false'
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" > /tmp/notes.md
          else
            git log --pretty=format:"- %s" "${LAST_TAG}..HEAD" > /tmp/notes.md
          fi
          [ -s /tmp/notes.md ] || echo "- Maintenance update" > /tmp/notes.md

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file /tmp/notes.md
